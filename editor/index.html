<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>本地内容工作台 · 知行手记</title><link rel="icon" href="/assets/favicon.svg"><script src="/assets/theme.js"></script><link rel="stylesheet" href="/assets/styles.css"><link rel="stylesheet" href="/editor/editor.css"><script src="/session.js" defer></script><script src="/editor/editor.js" defer></script></head><body><header class="editor-top"><div><strong>知行手记 / 内容工作台</strong><span>仅在本机运行 · 保存后自动生成网站</span></div><a href="/preview/index.html" target="_blank" rel="noopener" class="button">预览网站 ↗</a></header><main class="editor-layout"><aside class="editor-sidebar"><div class="button-row"><button type="button" class="button primary" id="new-post">新建文章</button><button type="button" class="button" id="settings">站点设置</button></div><label class="field">查找文章<input type="search" id="post-search" placeholder="标题或路径"></label><div id="post-list" class="post-list"></div><p class="tool-note">这不是公网后台。无需账号，仅限本机使用；不要对外开放这个端口。</p></aside><section class="editor-main"><p id="editor-status" role="status" aria-live="polite"></p><form id="post-form"><div class="editor-heading"><h1 id="form-title">编辑文章</h1><div><button type="button" id="delete-post" class="button danger">删除文章</button><button type="submit" class="button primary">保存并生成网站</button></div></div><label class="field">文章标题<input id="p-title" required maxlength="200" placeholder="从一个具体的问题开始"></label><div class="editor-row"><label class="field">文章路径（英文短横线；发布后不可直接修改）<input id="p-slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" placeholder="my-first-note" maxlength="120"></label><label class="field">主题<select id="p-category"></select></label><label class="field">发布日期<input id="p-date" type="date" required></label></div><label class="field">简短介绍<textarea id="p-summary" required rows="3" placeholder="一句话说明这篇文章讲什么"></textarea></label><label class="field">标签（用中文或英文逗号分隔）<input id="p-tags" placeholder="科研实践, Python"></label><div class="check-row"><label><input id="p-pinned" type="checkbox">精选文章</label><label><input id="p-featured" type="checkbox">首页主推荐</label><label><input id="p-draft" type="checkbox">草稿（不发布，不进入搜索索引）</label></div><label class="field">Markdown 正文<textarea id="p-body" rows="20" spellcheck="false" placeholder="## 第一个小标题"></textarea></label><p class="tool-note">支持标题、段落、加粗、列表、引用、链接、代码块与简单表格；不支持原始 HTML、复杂 YAML、LaTeX 或完整 CommonMark。文章元数据使用 JSON front matter。</p></form><form id="config-form" hidden><div class="editor-heading"><h1>站点设置</h1><button type="submit" class="button primary">保存设置并生成</button></div><div id="config-fields"></div><div class="check-row"><label><input id="c-demo" type="checkbox">演示模式：显示提示，并禁止搜索引擎收录</label></div><p class="tool-note">正式发布前，请替换演示文章、作者和联系方式，确认域名，然后取消演示模式。取消演示模式并不会自动把示例文章变成你的原创成果。没有取得的备案号请留空。</p></form></section></main></body></html>
